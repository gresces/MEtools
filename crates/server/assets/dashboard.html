<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="me-asset-version" content="{{ASSET_VERSION}}">
  <title>ME · 个人数据看板</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-mark">ME</div>
      <h1>个人数据看板</h1>
      <p>输入密码以查看你的行动、目标、日程与健康数据。</p>
      <form id="login-form">
        <input id="password-input" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
        <button type="submit">进入看板</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ME</div>
        <div>
          <strong>Personal OS</strong>
          <small id="brand-sub">data dashboard</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="overview" class="active" title="总览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>总览</span>
        </button>
        <button data-view="actions" title="行动">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>
          <span>行动</span>
        </button>
        <button data-view="goals" title="目标">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          <span>目标</span>
        </button>
        <button data-view="calendar" title="日程">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span>日程</span>
        </button>
        <button data-view="health" title="健康">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 8.5c0 4.5-8.5 10-8.5 10s-8.5-5.5-8.5-10A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8.5 2.5Z"/></svg>
          <span>健康</span>
        </button>
        <button data-view="life" title="生活">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4h6l1.5 5H7.5L9 4Z"/><path d="M7.5 9h9l1 8a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3l1-8Z"/></svg>
          <span>生活</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="profile-mini">
          <strong id="profile-mini-name">未设置名称</strong>
          <span id="profile-mini-meta">ME data</span>
        </div>
        <button id="edit-profile" class="profile-edit" type="button">编辑资料</button>
        <button id="logout" class="logout">退出登录</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">总览</h1>
        </div>
        <div class="top-actions">
          <span class="updated" id="updated">尚未加载</span>
          <button class="ghost" id="refresh" title="刷新数据">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
            刷新
          </button>
        </div>
      </header>
      <section id="view-overview" class="view"></section>
      <section id="view-actions" class="view hidden"></section>
      <section id="view-goals" class="view hidden"></section>
      <section id="view-calendar" class="view hidden"></section>
      <section id="view-health" class="view hidden"></section>
      <section id="view-life" class="view hidden"></section>
    </main>
  </div>

  <div id="editor-layer" class="editor-layer hidden" aria-hidden="true">
    <div id="editor-backdrop" class="editor-backdrop"></div>
    <aside id="editor-panel" class="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-title" tabindex="-1">
      <header class="editor-head">
        <div>
          <h2 id="editor-title"></h2>
          <p id="editor-sub" class="faint"></p>
        </div>
        <button id="editor-close" class="editor-close" type="button" aria-label="关闭">×</button>
      </header>
      <div id="editor-message" class="editor-message" role="alert" hidden></div>
      <div id="editor-actions" class="editor-actions" hidden></div>
      <form id="editor-form" novalidate>
        <div id="editor-fields" class="editor-fields"></div>
        <footer class="editor-foot">
          <span id="editor-hint" class="faint"></span>
          <div class="editor-buttons">
            <button id="editor-delete" class="editor-delete hidden" type="button">删除</button>
            <button id="editor-secondary" class="ghost hidden" type="button"></button>
            <button id="editor-cancel" class="ghost" type="button">取消</button>
            <button id="editor-submit" class="primary" type="submit">保存</button>
          </div>
        </footer>
      </form>
    </aside>
  </div>

  <div id="toast" class="toast"></div>
  <div id="cal-tip" class="cal-tip" hidden></div>

  <script type="module" src="/assets/dashboard.js"></script>
