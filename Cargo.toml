[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/personal",
    "crates/health",
    "crates/life",
    "crates/goal",
    "crates/store",
    "crates/test-support",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
shared = { path = "crates/shared" }
me-store = { path = "crates/store" }
me-test-support = { path = "crates/test-support" }
rusqlite = { version = "0.40", features = ["bundled"] }
personal = { path = "crates/personal" }
health = { path = "crates/health" }
life = { path = "crates/life" }
goal = { path = "crates/goal" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

